[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threat-classifier"
version = "0.1.0"
description = "Threat report severity classifier"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
classify = "threat_classifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
]
